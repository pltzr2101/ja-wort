services:
  ja-wort:
    image: ghcr.io/pltzr2101/ja-wort:latest
    container_name: ja-wort
    restart: unless-stopped
    ports:
      # Host-Port frei wählbar: auf dem Sammel-LXC belegt Open WebUI bereits 3000.
      - "${APP_PORT:-8095}:3000"
    environment:
      # GUEST_PASSWORD ist optional, wenn das Gaeste-Gate deaktiviert ist.
      - GUEST_PASSWORD=${GUEST_PASSWORD:-}
      # Gaeste-Gate (Passwort vor der Website). "false" schaltet es ab.
      - GUEST_GATE_ENABLED=${GUEST_GATE_ENABLED:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      # Named Volume: Docker übernimmt die Besitzrechte (UID 1001 / nextjs) aus dem
      # Image, dadurch ist kein manuelles chown vor dem Deploy nötig.
      - ja-wort-data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  ja-wort-data:
