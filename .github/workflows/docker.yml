name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Docker Image bauen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ja-wort:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
